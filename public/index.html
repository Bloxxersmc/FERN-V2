<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Korona</title>

<meta name="theme-color" content="#242424">

<!-- Scramjet -->
<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   KORONA
   ========================================================= */

:root {
    --bg: #07110b;
    --panel: #0d1b12;
    --panel2: #122319;
    --panel3: #172d20;

    --text: #effff3;
    --muted: #8aa592;

    --accent: #38e67b;
    --accent2: #23b85d;

    --border: #21452d;
    --danger: #ff5d68;

    --shadow: 0 18px 60px rgba(0,0,0,.45);
}


/* =========================================================
   SWITCH THEME
   ========================================================= */

body.switch-theme {
    --bg: #242424;

    --panel: #303030;
    --panel2: #383838;
    --panel3: #414141;

    --text: #f4f4f4;
    --muted: #b9b9b9;

    --accent: #42c8ff;
    --accent2: #42c8ff;

    --border: #505050;
    --danger: #ff5a5f;

    --shadow: 0 20px 70px rgba(0,0,0,.45);
}


/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus,
input:focus,
select:focus {
    outline: none;
}


/* =========================================================
   AUTH
   ========================================================= */

#authGate {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10000;

    background:
        radial-gradient(
            circle at 50% 25%,
            #1c4429 0%,
            #07110b 55%,
            #020402 100%
        );
}

body.switch-theme #authGate {
    background: #242424;
}

.auth-card {
    width: min(440px, 92vw);
    padding: 38px;

    background: rgba(11,23,16,.96);

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    text-align: center;
}

body.switch-theme .auth-card {
    background: #303030;
    border: 0;
    box-shadow: none;
}

.auth-logo {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -3px;
}

.auth-sub {
    color: var(--muted);
    margin: 8px 0 28px;
}

.auth-input {
    width: 100%;

    padding: 14px 16px;
    margin-bottom: 12px;

    background: #07100a;

    border: 1px solid var(--border);

    color: var(--text);
}

body.switch-theme .auth-input {
    background: #242424;
    border-color: #555;
}

.auth-button {
    width: 100%;

    padding: 14px;

    border: 0;

    background: var(--accent);
    color: #031007;

    font-weight: 800;

    margin-top: 8px;
}

.auth-secondary {
    width: 100%;

    padding: 13px;

    border: 1px solid var(--border);

    background: transparent;
    color: var(--text);

    margin-top: 10px;
}

.auth-message {
    min-height: 22px;

    color: var(--muted);

    font-size: 13px;

    margin: 12px 0;
}


/* =========================================================
   APPLICATION
   ========================================================= */

#app {
    display: none;

    width: 100%;
    height: 100%;
}

#appShell {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns: 210px 1fr;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    display: flex;
    flex-direction: column;

    gap: 8px;

    padding: 16px 12px;

    background: #08130b;

    border-right: 1px solid var(--border);
}

body.switch-theme .sidebar {
    background: #303030;
    border-right: 0;
}

.brand {
    padding: 10px 12px 18px;

    font-size: 25px;

    font-weight: 900;

    letter-spacing: -1px;
}

.nav {
    display: flex;
    flex-direction: column;

    gap: 5px;
}

.nav button {
    width: 100%;

    border: 0;

    background: transparent;

    color: var(--muted);

    padding: 12px;

    border-radius: 10px;

    text-align: left;

    transition:
        background .15s,
        color .15s;
}

.nav button:hover {
    background: var(--panel2);
    color: var(--text);
}

.nav button.active {
    background: var(--panel2);
    color: var(--text);
}

.sidebar-bottom {
    margin-top: auto;
}


/* =========================================================
   SWITCH SIDEBAR
   ========================================================= */

body.switch-theme .sidebar {
    border-radius: 0;
}

body.switch-theme .nav button {
    border-radius: 0;

    padding: 13px 14px;
}

body.switch-theme .nav button.active {
    background: #414141;

    border-left:
        4px solid
        #42c8ff;
}


/* =========================================================
   MAIN
   ========================================================= */

.main {
    min-width: 0;

    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TABS
   ========================================================= */

.tabstrip {
    display: flex;

    gap: 5px;

    padding: 7px 10px;

    background: #060d08;

    border-bottom: 1px solid var(--border);

    overflow-x: auto;

    scrollbar-width: none;
}

.tabstrip::-webkit-scrollbar {
    display: none;
}

body.switch-theme .tabstrip {
    background: #2a2a2a;

    border-bottom:
        1px solid
        #454545;
}

.tab {
    display: flex;

    align-items: center;

    gap: 7px;

    white-space: nowrap;

    min-width: 130px;

    padding: 8px 11px;

    background: var(--panel);

    color: var(--muted);

    border:
        1px solid
        transparent;
}

.tab.active {
    background: var(--panel2);

    color: var(--text);

    border-color: var(--border);
}

.tab .close {
    opacity: .7;

    margin-left: auto;
}

.tabadd {
    border: 0;

    background: transparent;

    color: var(--text);

    font-size: 20px;

    padding: 4px 10px;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    height: 58px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 8px 14px;

    background: #08130b;

    border-bottom:
        1px solid
        var(--border);
}

body.switch-theme .topbar {
    background: #242424;

    border-bottom:
        1px solid
        #484848;
}

.topbar button {
    border: 0;

    background: var(--panel2);

    color: var(--text);

    padding: 9px 12px;
}

.address {
    flex: 1;

    min-width: 0;

    display: flex;

    gap: 8px;
}

.address input {
    flex: 1;

    min-width: 0;

    padding: 10px 14px;

    background: var(--panel);

    border:
        1px solid
        var(--border);

    color: var(--text);
}

body.switch-theme .address input {
    background: #303030;
    border-color: #505050;
}


/* =========================================================
   WORKSPACE
   ========================================================= */

.workspace {
    position: relative;

    flex: 1;

    min-height: 0;

    overflow: auto;
}

.view {
    display: none;

    min-height: 100%;

    padding: 28px;
}

.view.active {
    display: block;
}

h1 {
    margin: 0 0 8px;

    font-size: 34px;
}

.muted {
    color: var(--muted);
}


/* =========================================================
   CARDS
   ========================================================= */

.cards {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px, 1fr)
        );

    gap: 16px;

    margin-top: 24px;
}

.card {
    background: var(--panel);

    border:
        1px solid
        var(--border);

    padding: 14px;

    cursor: pointer;

    transition:
        transform .15s,
        border-color .15s;
}

.card:hover {
    transform: translateY(-2px);

    border-color:
        var(--accent);
}

.card img {
    width: 100%;

    aspect-ratio: 16 / 9;

    object-fit: cover;

    background: #000;

    margin-bottom: 12px;
}

.card h3 {
    margin: 0 0 5px;
}

.card p {
    margin: 0;

    color: var(--muted);

    font-size: 13px;
}


/* =========================================================
   BROWSER
   ========================================================= */

.browser {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

.browser-frame {
    flex: 1;

    min-height: 0;

    background: white;

    position: relative;
}

.browser-frame iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    background: white;
}


/* =========================================================
   SETTINGS
   ========================================================= */

.settings-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 14px;

    margin-top: 20px;
}

.setting-card {
    background: var(--panel);

    border:
        1px solid
        var(--border);

    padding: 18px;
}

.setting-card h3 {
    margin-top: 0;
}

select {
    width: 100%;

    padding: 12px;

    background: var(--panel);

    color: var(--text);

    border:
        1px solid
        var(--border);
}

.theme-preview {
    height: 75px;

    margin-bottom: 12px;

    border:
        1px solid
        var(--border);

    background:
        linear-gradient(
            135deg,
            #0b1710,
            #38e67b
        );
}

.theme-preview.switch {
    background:
        linear-gradient(
            135deg,
            #242424 0%,
            #242424 48%,
            #42c8ff 48%,
            #42c8ff 52%,
            #242424 52%
        );
}


/* =========================================================
   ACCOUNT
   ========================================================= */

.account {
    max-width: 600px;

    background: var(--panel);

    border:
        1px solid
        var(--border);

    padding: 24px;
}

.account-row {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    border-bottom:
        1px solid
        var(--border);

    padding: 13px 0;
}

.danger {
    background: var(--danger);

    color: white;

    border: 0;

    padding: 12px 16px;

    margin-top: 18px;
}


/* =========================================================
   SWITCH HOME
   ========================================================= */

.switch-home {
    min-height: 100%;

    padding:
        28px
        34px
        22px;

    display: flex;

    flex-direction: column;

    background: #242424;

    color: #f4f4f4;
}

.switch-status {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;

    font-size: 14px;
}

.switch-profile {
    display: flex;

    align-items: center;

    gap: 10px;
}

.switch-avatar {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #555;

    display: grid;

    place-items: center;

    font-weight: 800;
}

.switch-time {
    display: flex;

    align-items: center;

    gap: 15px;
}


/* =========================================================
   SWITCH SOFTWARE ROW
   ========================================================= */

.switch-games {
    display: flex;

    gap: 14px;

    overflow-x: auto;

    padding:
        8px
        2px
        22px;

    scrollbar-width: none;
}

.switch-games::-webkit-scrollbar {
    display: none;
}

.switch-game {
    flex:
        0 0
        190px;

    aspect-ratio: 1;

    position: relative;

    padding: 0;

    overflow: hidden;

    background: #111;

    border: 0;

    box-shadow:
        0 0 0 1px #444;
}

.switch-game img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.switch-game span {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        10px
        9px;

    text-align: left;

    font-weight: 700;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );
}

.switch-game:hover {
    box-shadow:
        0 0 0 3px #777;
}

.switch-game.selected {
    box-shadow:
        0 0 0 4px #f4f4f4;
}

.switch-more {
    margin-top: 8px;

    text-align: right;

    color: #aaa;

    font-size: 13px;
}


/* =========================================================
   SWITCH BOTTOM MENU
   ========================================================= */

.switch-bottom {
    margin-top: auto;

    border-top:
        1px solid
        #555;

    padding-top: 20px;

    display: flex;

    gap: 20px;

    align-items: center;

    justify-content: center;

    flex-wrap: wrap;
}

.switch-icon {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: 0;

    background: #444;

    color: white;

    display: grid;

    place-items: center;

    font-size: 23px;

    box-shadow:
        inset 0 1px #666;

    transition:
        transform .15s,
        background .15s;
}

.switch-icon:hover {
    background: #fff;

    color: #222;

    transform:
        translateY(-2px);
}


/* =========================================================
   SWITCH SECONDARY PAGES
   ========================================================= */

.switch-page {
    min-height: 100%;

    padding:
        28px
        34px;

    background: #242424;

    color: #f4f4f4;
}

.switch-page h1 {
    font-weight: 500;
}

.switch-page .card {
    background: #303030;

    border-color: #4c4c4c;

    border-radius: 0;
}

.switch-page .card:hover {
    transform: none;

    border-color: white;
}

.switch-page .setting-card {
    background: #303030;

    border-color: #4c4c4c;
}

.switch-page .account {
    background: #303030;

    border-color: #4c4c4c;
}


/* =========================================================
   LOADING
   ========================================================= */

#browserOverlay {
    position: absolute;

    inset: 0;

    display: none;

    place-items: center;

    background: rgba(0,0,0,.55);

    color: white;

    z-index: 50;
}

.loader {
    padding:
        18px
        24px;

    background: #222;

    border:
        1px solid
        #555;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width: 800px) {

    #appShell {
        grid-template-columns:
            72px
            1fr;
    }

    .sidebar {
        padding:
            10px
            6px;
    }

    .brand {
        font-size: 0;

        text-align: center;
    }

    .brand::after {
        content: "K";

        font-size: 25px;
    }

    .nav button {
        font-size: 0;

        text-align: center;
    }

    .nav button::first-letter {
        font-size: 20px;
    }

    .view {
        padding: 20px;
    }

    .topbar {
        flex-wrap: wrap;

        height: auto;
    }

    .switch-home,
    .switch-page {
        padding:
            20px;
    }

    .switch-game {
        flex-basis: 150px;
    }
}
</style>
</head>

<div id="app">

                <div
                    id="view-apps"
                    class="view"
                ></div>

                <div
                    id="view-browser"
                    class="view"
                ></div>

                <div
                    id="view-settings"
                    class="view"
                ></div>

                <div
                    id="view-account"
                    class="view"
                ></div>

                <div id="browserOverlay">

                    <div class="loader">
                        Loading…
                    </div>

                </div>

            </section>

        </main>

    </div>

</div>

/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /[&<>"']/g,
            char => {

                return {

                    "&":
                        "&amp;",

                    "<":
                        "&lt;",

                    ">":
                        "&gt;",

                    '"':
                        "&quot;",

                    "'":
                        "&#039;"

                }[char];

            }
        );
}


/* =========================================================

function isSwitch() {
    return currentTheme === "switch";

function showView(view) {

                )
        );

    }

    document

            button.classList.toggle(
                "active",
                button.dataset.view === view
            );

/* =========================================================
   TABS
   ========================================================= */

function createTab(url = "") {

    const id =
        crypto.randomUUID();

    const tab = {

        id,

        title:
            "New Tab",

        url:
            "",

        history:
            [],

        index:
            -1

    };

    tabs.push(tab);

    activeTabId =
        id;

    renderTabs();

    if (url) {
        navigate(url);
    } else {
        showView("browser");
    }
}


/* =========================================================
   ACTIVE TAB
   ========================================================= */

function activeTab() {

    return tabs.find(
        tab =>
            tab.id === activeTabId
    ) || null;
}


/* =========================================================
   RENDER TABS
   ========================================================= */

function renderTabs() {

    const strip =
        document.getElementById(
            "tabStrip"
        );

    strip.innerHTML =

        tabs.map(tab => `

            <div
                class="tab ${
                    tab.id === activeTabId
                        ? "active"
                        : ""
                }"
                data-id="${tab.id}"
            >

                <span>
                    ${
                        escapeHTML(
                            tab.title
                        )
                    }
                </span>

                <span
                    class="close"
                    data-close="${tab.id}"
                >
                    ×
                </span>

            </div>

        `).join("") +

        `

            <button
                class="tabadd"
                id="newTabButton"
            >
                +
            </button>

        `;

    strip
        .querySelectorAll(".tab")
        .forEach(element => {

            element.onclick =
                event => {

                    if (
                        event.target.dataset.close
                    ) {
                        return;
                    }

                    activeTabId =
                        element.dataset.id;

                    const tab =
                        activeTab();

                    if (tab) {

                        document
                            .getElementById(
                                "addressInput"
                            )
                            .value =
                            tab.url || "";

                    }

                    showView("browser");

                    renderTabs();
                };

        });

    strip
        .querySelectorAll(
            "[data-close]"
        )
        .forEach(close => {

            close.onclick =
                event => {

                    event.stopPropagation();

                    closeTab(
                        close.dataset.close
                    );

                };

        });

    document
        .getElementById(
            "newTabButton"
        )
        .onclick =
        () => createTab();
}


/* =========================================================
   CLOSE TAB
   ========================================================= */

function closeTab(id) {

    const index =
        tabs.findIndex(
            tab =>
                tab.id === id
        );

    if (index < 0) {
        return;
    }

    tabs.splice(
        index,
        1
    );

    if (
        activeTabId === id
    ) {

        activeTabId =
            tabs[
                Math.max(
                    0,
                    index - 1
                )
            ]?.id || null;

    }

    if (!tabs.length) {

        createTab();

        return;
    }

    renderTabs();

    renderBrowser();
}


/* =========================================================
   URL NORMALIZER
   ========================================================= */

function normalizeURL(value) {

    value =
        value.trim();

    if (!value) {
        return "";
    }

    if (
        /^https?:\/\//i.test(
            value
        )
    ) {
        return value;
    }

    if (
        value.includes(".") &&
        !value.includes(" ")
    ) {
        return "https://" + value;
    }

    return (
        "https://www.google.com/search?q="
        +
        encodeURIComponent(value)
    );
}


/* =========================================================
   NAVIGATE
   ========================================================= */

function navigate(raw) {

    const url =
        normalizeURL(raw);

    if (!url) {
        return;
    }

    let tab =
        activeTab();

    if (!tab) {

        createTab();

        tab =
            activeTab();
    }

    if (
        tab.index <
        tab.history.length - 1
    ) {

        tab.history =
            tab.history.slice(
                0,
                tab.index + 1
            );
    }

    tab.history.push(
        url
    );

    tab.index++;

    tab.url =
        url;

    try {

        tab.title =
            new URL(
                url
            ).hostname;

    } catch {

        tab.title =
            "Korona Browser";
    }

    document
        .getElementById(
            "addressInput"
        )
        .value =
        url;

    renderTabs();

    renderBrowser();
}


/* =========================================================
   OPEN URL
   ========================================================= */

function openURL(url) {

    if (!activeTab()) {
        createTab();
    }

    navigate(url);

    showView(
        "browser"
    );
}

    )
    .onclick =
    () => {

        const tab =
            activeTab();

        if (
            !tab ||
            tab.index >=
                tab.history.length - 1
        ) {

            return;

        }

        tab.index++;

        tab.url =
            tab.history[
                tab.index
            ];

        renderBrowser();

        renderTabs();

    };

/* =========================================================
   AUTH
   ========================================================= */

async function checkSavedUser() {

    const savedId =
        localStorage.getItem(
            USER_KEY
        );

    if (!savedId) {

        document
            .getElementById(
                "authGate"
            )
            .style.display =
            "flex";

        document
            .getElementById(
                "app"
            )
            .style.display =
            "none";

        document
            .getElementById(
                "authMessage"
            )
            .textContent =
            "This browser has no Korona account.";

        return false;
    }

    const message =
        document.getElementById(
            "authMessage"
        );

    message.textContent =
        "Checking Korona access…";

    try {

        const {
            data,
            error
        } =
            await supabase

                .from(
                    "korona_users"
                )

                .select(
                    "id,name,active"
                )

                .eq(
                    "id",
                    savedId
                )

                .maybeSingle();

        if (error) {

            console.error(
                "Korona Supabase error:",
                error
            );

            message.textContent =
                "Could not connect to Korona.";

            return false;
        }

        if (!data) {

            localStorage.removeItem(
                USER_KEY
            );

            message.textContent =
                "This Korona ID no longer exists.";

            return false;
        }

        if (
            data.active !== true
        ) {

            message.textContent =
                "This Korona account is not active.";

            document
                .getElementById(
                    "authGate"
                )
                .style.display =
                "flex";

            document
                .getElementById(
                    "app"
                )
                .style.display =
                "none";

            return false;
        }

        localStorage.setItem(
            "korona.user.id",
            data.id
        );

        localStorage.setItem(
            "korona.user.name",
            data.name || ""
        );

        document
            .getElementById(
                "authGate"
            )
            .style.display =
            "none";

        document
            .getElementById(
                "app"
            )
            .style.display =
            "block";

        renderAll();

        console.log(
            "Korona automatically logged in:",
            data.id
        );

        return true;

    } catch (error) {

        console.error(
            "Korona login error:",
            error
        );

        message.textContent =
            "Something went wrong connecting to Korona.";

        return false;
    }
}


/* =========================================================
   PERIODIC ACCESS CHECK
   ========================================================= */

let accessCheckRunning = false;

setInterval(
    async () => {

        const savedId =
            localStorage.getItem(
                USER_KEY
            );

        if (
            !savedId ||
            accessCheckRunning
        ) {
            return;
        }

        accessCheckRunning = true;

        try {

            const {
                data,
                error
            } =
                await supabase
                    .from(
                        "korona_users"
                    )
                    .select(
                        "id,active"
                    )
                    .eq(
                        "id",
                        savedId
                    )
                    .maybeSingle();

            if (
                error ||
                !data ||
                data.active !== true
            ) {

                document
                    .getElementById(
                        "app"
                    )
                    .style.display =
                    "none";

                document
                    .getElementById(
                        "authGate"
                    )
                    .style.display =
                    "flex";

                document
                    .getElementById(
                        "authMessage"
                    )
                    .textContent =
                    !data
                        ? "This Korona account no longer exists."
                        : "Korona access has been disabled.";

            }

        } catch (error) {

            console.error(
                "Periodic Korona access check failed:",
                error
            );

        } finally {

            accessCheckRunning = false;

        }

    },
    5000
);


/* =========================================================
   LOGOUT / LOCK
   ========================================================= */

function koronaLogout() {

    document
        .getElementById(
            "app"
        )
        .style.display =

}

/* =========================================================
   CREATE ACCOUNT
   ========================================================= */

document
    .getElementById(
        "createButton"
    )
    .onclick =
    async () => {

        const firstName =
            document
                .getElementById(
                    "firstName"
                )
                .value
                .trim();

        const lastName =
            document
                .getElementById(
                    "lastName"
                )
                .value
                .trim();

        const message =
            document
                .getElementById(
                    "createMessage"
                );

        if (
            !firstName ||
            !lastName
        ) {

            message.textContent =
                "Enter your first and last name.";

            return;
        }

        const id =

            `${firstName}.${lastName}`

                .toLowerCase()

                .replace(
                    /[^a-z0-9.]/g,
                    ""
                );

        try {

            const {
                data: existing,
                error: checkError
            } =
                await supabase

                    .from(
                        "korona_users"
                    )

                    .select(
                        "id"
                    )

                    .eq(
                        "id",
                        id
                    )

                    .maybeSingle();

            if (checkError) {

                console.error(
                    checkError
                );

                message.textContent =
                    "Could not check that Korona ID.";

                return;
            }

            if (existing) {

                message.textContent =
                    `"${id}" is already taken.`;

                return;
            }

            const {
                data,
                error
            } =
                await supabase

                    .from(
                        "korona_users"
                    )

                    .insert({

                        id:
                            id,

                        name:
                            `${firstName} ${lastName}`,

                        active:
                            true

                    })

                    .select(
                        "id,name,active"
                    )

                    .single();

            if (error) {

                console.error(
                    "Korona account creation failed:",
                    error
                );

                message.textContent =
                    error.message ||
                    "Could not create the account.";

                return;
            }

            localStorage.setItem(
                USER_KEY,
                data.id
            );

            localStorage.setItem(
                "korona.user.id",
                data.id
            );

            localStorage.setItem(
                "korona.user.name",
                data.name || ""
            );

            document
                .getElementById(
                    "authGate"
                )
                .style.display =
                "none";

            document
                .getElementById(
                    "app"
                )
                .style.display =
                "block";

            renderAll();

            console.log(
                "Korona account created:",
                data.id
            );

        } catch (error) {

            console.error(
                "Korona account creation error:",
                error
            );

            message.textContent =
                "Something went wrong creating the account.";
        }
    };
