<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Korona</title>

<meta name="theme-color" content="#07110b">

<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   KORONA
   ========================================================= */

:root {
    --bg: #07110b;
    --bg2: #0a170e;

    --panel: #0d1b12;
    --panel2: #122319;
    --panel3: #172d20;

    --text: #effff3;
    --muted: #8aa592;

    --accent: #38e67b;
    --accent2: #23b85d;

    --border: #21452d;
    --danger: #ff5d68;

    --radius: 10px;

    --shadow:
        0 20px 70px rgba(0,0,0,.45);
}


/* =========================================================
   SWITCH THEME VARIABLES
   ========================================================= */

body.switch-theme {

    --bg: #242424;
    --bg2: #2a2a2a;

    --panel: #303030;
    --panel2: #393939;
    --panel3: #444444;

    --text: #f5f5f5;
    --muted: #b8b8b8;

    --accent: #42c8ff;
    --accent2: #32b9f2;

    --border: #505050;
    --danger: #ff5a5f;

    --radius: 0;

    --shadow:
        0 20px 70px rgba(0,0,0,.45);
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--bg);

    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: wait;
    opacity: .55;
}


/* =========================================================
   AUTH
   ========================================================= */

#authGate {

    position: fixed;

    inset: 0;

    z-index: 10000;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(56,230,123,.14),
            transparent 45%
        ),
        var(--bg);

    transition:
        background .3s;
}


/* =========================================================
   AUTH BACKGROUND
   ========================================================= */

.auth-background {

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: hidden;
}

.auth-background::before {

    content: "";

    position: absolute;

    width: 600px;
    height: 600px;

    top: -300px;
    left: 50%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(56,230,123,.18),
            transparent 65%
        );

    filter: blur(30px);
}

body.switch-theme .auth-background::before {

    background:
        radial-gradient(
            circle,
            rgba(66,200,255,.20),
            transparent 65%
        );
}


/* =========================================================
   AUTH WRAPPER
   ========================================================= */

.auth-shell {

    position: relative;

    z-index: 2;

    width:
        min(
            470px,
            calc(100vw - 32px)
        );

    max-height:
        calc(100vh - 32px);

    overflow-y: auto;
}


/* =========================================================
   AUTH CARD
   ========================================================= */

.auth-card {

    width: 100%;

    padding: 30px;

    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius);

    box-shadow:
        var(--shadow);
}


/* =========================================================
   SWITCH AUTH
   ========================================================= */

body.switch-theme .auth-card {

    background: #303030;

    border: 0;

    border-radius: 0;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);

    padding: 34px;
}

body.switch-theme #authGate {

    background:
        linear-gradient(
            180deg,
            #242424 0%,
            #2c2c2c 70%,
            #242424 100%
        );
}


/* =========================================================
   AUTH HEADER
   ========================================================= */

.auth-header {

    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 26px;
}

.auth-logo {

    width: 52px;
    height: 52px;

    display: grid;

    place-items: center;

    flex-shrink: 0;

    background:
        var(--accent);

    color:
        #031007;

    font-weight: 950;

    font-size: 23px;

    border-radius:
        var(--radius);
}

body.switch-theme .auth-logo {

    border-radius: 50%;

    background:
        #42c8ff;

    color: #242424;
}

.auth-title {

    font-size: 25px;

    font-weight: 900;

    letter-spacing: -.8px;
}

.auth-subtitle {

    margin-top: 3px;

    color: var(--muted);

    font-size: 13px;
}


/* =========================================================
   AUTH STATUS
   ========================================================= */

.auth-status {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px 14px;

    margin-bottom: 18px;

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    color: var(--muted);

    font-size: 13px;

    border-radius:
        var(--radius);
}

body.switch-theme .auth-status {

    border-radius: 0;

    background: #292929;

    border-color: #484848;
}

.auth-status-dot {

    width: 8px;
    height: 8px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        var(--accent);

    box-shadow:
        0 0 10px
        var(--accent);
}


/* =========================================================
   AUTH FORMS
   ========================================================= */

.auth-form {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.auth-label {

    color: var(--muted);

    font-size: 12px;

    font-weight: 700;

    margin-top: 4px;
}

.auth-input {

    width: 100%;

    padding: 13px 14px;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius);

    background:
        var(--bg);

    color:
        var(--text);

    transition:
        border-color .15s,
        background .15s;
}

.auth-input:focus {

    border-color:
        var(--accent);

    background:
        var(--panel);
}

body.switch-theme .auth-input {

    border-radius: 0;

    background: #242424;

    border-color: #505050;
}


/* =========================================================
   AUTH BUTTONS
   ========================================================= */

.auth-button {

    width: 100%;

    padding: 13px 16px;

    margin-top: 7px;

    border: 0;

    border-radius:
        var(--radius);

    background:
        var(--accent);

    color:
        #031007;

    font-weight: 850;

    transition:
        filter .15s,
        transform .15s;
}

.auth-button:hover {

    filter: brightness(1.08);

    transform:
        translateY(-1px);
}

body.switch-theme .auth-button {

    border-radius: 0;

    background:
        #42c8ff;

    color:
        #202020;
}

.auth-secondary {

    width: 100%;

    padding: 12px 16px;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius);

    background:
        transparent;

    color:
        var(--text);

    transition:
        background .15s,
        border-color .15s;
}

.auth-secondary:hover {

    background:
        var(--panel2);

    border-color:
        var(--accent);
}

body.switch-theme .auth-secondary {

    border-radius: 0;

    background: #383838;

    border-color: #555;
}


/* =========================================================
   AUTH FOOTER
   ========================================================= */

.auth-footer {

    margin-top: 20px;

    padding-top: 15px;

    border-top:
        1px solid
        var(--border);

    color: var(--muted);

    font-size: 11px;

    line-height: 1.5;

    text-align: center;
}


/* =========================================================
   APPLICATION
   ========================================================= */

#app {

    display: none;

    width: 100%;
    height: 100%;
}

#appShell {

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        210px
        1fr;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

    display: flex;

    flex-direction: column;

    gap: 8px;

    padding: 15px 11px;

    background:
        var(--bg2);

    border-right:
        1px solid
        var(--border);
}

.brand {

    padding:
        10px 12px 18px;

    font-size: 24px;

    font-weight: 950;

    letter-spacing: -1px;
}

.nav {

    display: flex;

    flex-direction: column;

    gap: 4px;
}

.nav button {

    width: 100%;

    border: 0;

    border-radius:
        var(--radius);

    background:
        transparent;

    color:
        var(--muted);

    padding: 12px;

    text-align: left;

    transition:
        background .15s,
        color .15s;
}

.nav button:hover {

    background:
        var(--panel2);

    color:
        var(--text);
}

.nav button.active {

    background:
        var(--panel2);

    color:
        var(--text);
}

.nav button span {

    margin-left: 7px;
}

.sidebar-bottom {

    margin-top: auto;
}


/* =========================================================
   SWITCH SIDEBAR
   ========================================================= */

body.switch-theme .sidebar {

    background:
        #303030;

    border-right:
        0;
}

body.switch-theme .nav button {

    border-radius: 0;
}

body.switch-theme .nav button.active {

    background:
        #414141;

    border-left:
        4px solid
        #42c8ff;
}


/* =========================================================
   MAIN
   ========================================================= */

.main {

    min-width: 0;

    height: 100%;

    display: flex;

    flex-direction: column;
}


/* =========================================================
   TABS
   ========================================================= */

.tabstrip {

    display: flex;

    gap: 5px;

    padding:
        7px 10px;

    background:
        var(--bg);

    border-bottom:
        1px solid
        var(--border);

    overflow-x: auto;

    scrollbar-width: none;
}

.tabstrip::-webkit-scrollbar {
    display: none;
}

.tab {

    display: flex;

    align-items: center;

    gap: 7px;

    min-width: 130px;

    padding:
        8px 11px;

    background:
        var(--panel);

    color:
        var(--muted);

    border:
        1px solid
        transparent;

    white-space: nowrap;
}

.tab.active {

    background:
        var(--panel2);

    color:
        var(--text);

    border-color:
        var(--border);
}

.tab .close {

    margin-left: auto;

    opacity: .7;

    cursor: pointer;
}

.tabadd {

    border: 0;

    background:
        transparent;

    color:
        var(--text);

    font-size: 20px;

    padding:
        4px 10px;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {

    min-height: 58px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        8px 12px;

    background:
        var(--bg2);

    border-bottom:
        1px solid
        var(--border);
}

.topbar button {

    border: 0;

    border-radius:
        var(--radius);

    background:
        var(--panel2);

    color:
        var(--text);

    padding:
        9px 12px;
}

.address {

    flex: 1;

    min-width: 0;

    display: flex;

    gap: 7px;
}

.address input {

    flex: 1;

    min-width: 0;

    padding:
        10px 13px;

    background:
        var(--panel);

    color:
        var(--text);

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius);
}


/* =========================================================
   WORKSPACE
   ========================================================= */

.workspace {

    position: relative;

    flex: 1;

    min-height: 0;

    overflow: auto;
}

.view {

    display: none;

    min-height: 100%;

    padding: 28px;
}

.view.active {
    display: block;
}

h1 {

    margin:
        0 0 8px;

    font-size: 34px;
}

.muted {

    color:
        var(--muted);
}


/* =========================================================
   CARDS
   ========================================================= */

.cards {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px, 1fr)
        );

    gap: 16px;

    margin-top: 24px;
}

.card {

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    padding: 14px;

    cursor: pointer;

    border-radius:
        var(--radius);

    transition:
        transform .15s,
        border-color .15s;
}

.card:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--accent);
}

.card img {

    width: 100%;

    aspect-ratio: 16 / 9;

    object-fit: cover;

    background:
        #000;

    margin-bottom: 12px;

    border-radius:
        calc(
            var(--radius) / 2
        );
}

.card h3 {

    margin:
        0 0 5px;
}

.card p {

    margin: 0;

    color:
        var(--muted);

    font-size: 13px;
}


/* =========================================================
   BROWSER
   ========================================================= */

.browser {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;
}

.browser-frame {

    flex: 1;

    min-height: 0;

    background:
        white;

    position: relative;
}

.browser-frame iframe {

    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    background:
        white;
}


/* =========================================================
   SETTINGS
   ========================================================= */

.settings-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px, 1fr)
        );

    gap: 14px;

    margin-top: 20px;
}

.setting-card {

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    padding: 18px;

    border-radius:
        var(--radius);
}

.setting-card h3 {

    margin-top: 0;
}

select {

    width: 100%;

    padding: 12px;

    background:
        var(--panel);

    color:
        var(--text);

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius);
}


/* =========================================================
   ACCOUNT
   ========================================================= */

.account {

    max-width: 600px;

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    padding: 24px;

    border-radius:
        var(--radius);
}

.account-row {

    display: flex;

    justify-content: space-between;

    gap: 20px;

    padding:
        13px 0;

    border-bottom:
        1px solid
        var(--border);
}

.danger {

    background:
        var(--danger);

    color:
        white;

    border: 0;

    border-radius:
        var(--radius);

    padding:
        12px 16px;

    margin-top: 18px;
}


/* =========================================================
   SWITCH HOME
   ========================================================= */

.switch-home {

    min-height: 100%;

    padding:
        28px 34px 22px;

    display: flex;

    flex-direction: column;

    background:
        #242424;

    color:
        #f4f4f4;
}

.switch-status {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;

    font-size: 14px;
}

.switch-profile {

    display: flex;

    align-items: center;

    gap: 10px;
}

.switch-avatar {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background:
        #555;

    display: grid;

    place-items: center;

    font-weight: 800;
}

.switch-time {

    display: flex;

    align-items: center;

    gap: 15px;
}


/* =========================================================
   SWITCH GAMES
   ========================================================= */

.switch-games {

    display: flex;

    gap: 14px;

    overflow-x: auto;

    padding:
        8px 2px 22px;

    scrollbar-width: none;
}

.switch-games::-webkit-scrollbar {
    display: none;
}

.switch-game {

    flex:
        0 0 190px;

    aspect-ratio: 1;

    position: relative;

    padding: 0;

    overflow: hidden;

    background:
        #111;

    border: 0;

    box-shadow:
        0 0 0 1px #444;

    cursor: pointer;
}

.switch-game img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.switch-game span {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        10px 9px;

    text-align: left;

    font-weight: 700;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );
}

.switch-game:hover {

    box-shadow:
        0 0 0 3px #777;
}


/* =========================================================
   SWITCH BOTTOM
   ========================================================= */

.switch-bottom {

    margin-top: auto;

    border-top:
        1px solid
        #555;

    padding-top: 20px;

    display: flex;

    gap: 20px;

    align-items: center;

    justify-content: center;

    flex-wrap: wrap;
}

.switch-icon {

    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: 0;

    background:
        #444;

    color:
        white;

    display: grid;

    place-items: center;

    font-size: 23px;

    transition:
        transform .15s,
        background .15s;
}

.switch-icon:hover {

    background:
        #fff;

    color:
        #222;

    transform:
        translateY(-2px);
}


/* =========================================================
   SWITCH SECONDARY PAGES
   ========================================================= */

.switch-page {

    min-height: 100%;

    padding:
        28px 34px;

    background:
        #242424;

    color:
        #f4f4f4;
}

.switch-page .card {

    background:
        #303030;

    border-color:
        #4c4c4c;

    border-radius:
        0;
}

.switch-page .card:hover {

    transform:
        none;

    border-color:
        white;
}

.switch-page .setting-card {

    background:
        #303030;

    border-color:
        #4c4c4c;

    border-radius:
        0;
}

.switch-page .account {

    background:
        #303030;

    border-color:
        #4c4c4c;

    border-radius:
        0;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width: 800px) {

    #appShell {

        grid-template-columns:
            72px 1fr;
    }

    .sidebar {

        padding:
            10px 6px;
    }

    .brand {

        font-size: 0;

        text-align: center;
    }

    .brand::after {

        content:
            "K";

        font-size:
            25px;
    }

    .nav button {

        font-size:
            0;

        text-align:
            center;
    }

    .nav button span {

        display:
            none;
    }

    .view {

        padding:
            20px;
    }

    .topbar {

        flex-wrap:
            wrap;

        height:
            auto;
    }

    .switch-home,
    .switch-page {

        padding:
            20px;
    }

    .switch-game {

        flex-basis:
            150px;
    }

    .auth-card {

        padding:
            23px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     AUTH PAGE
     ========================================================= -->

<div id="authGate">

    <div class="auth-background"></div>

    <div class="auth-shell">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-logo">
                    K
                </div>

                <div>

                    <div class="auth-title">
                        Korona
                    </div>

                    <div class="auth-subtitle">
                        Your personal web workspace
                    </div>

                </div>

            </div>


            <!-- LOGIN -->

            <div id="loginScreen">

                <div class="auth-status">

                    <div class="auth-status-dot"></div>

                    <div id="authMessage">
                        Checking Korona access...
                    </div>

                </div>

                <div class="auth-form">

                    <button
                        class="auth-button"
                        id="loginButton"
                        type="button"
                    >
                        CHECK KORONA ACCESS
                    </button>

                    <button
                        class="auth-secondary"
                        id="showCreateButton"
                        type="button"
                    >
                        CREATE ACCOUNT
                    </button>

                </div>

            </div>


            <!-- CREATE -->

            <div
                id="createScreen"
                style="display:none;"
            >

                <div class="auth-status">

                    <div class="auth-status-dot"></div>

                    <div>
                        Submit your name for Korona approval.
                    </div>

                </div>

                <div class="auth-form">

                    <label class="auth-label">
                        FIRST NAME
                    </label>

                    <input
                        class="auth-input"
                        id="firstName"
                        type="text"
                        placeholder="First name"
                        autocomplete="given-name"
                    >

                    <label class="auth-label">
                        LAST NAME
                    </label>

                    <input
                        class="auth-input"
                        id="lastName"
                        type="text"
                        placeholder="Last name"
                        autocomplete="family-name"
                    >

                    <div
                        class="auth-message"
                        id="createMessage"
                    ></div>

                    <button
                        class="auth-button"
                        id="createButton"
                        type="button"
                    >
                        SUBMIT ACCOUNT
                    </button>

                    <button
                        class="auth-secondary"
                        id="backLoginButton"
                        type="button"
                    >
                        BACK
                    </button>

                </div>

            </div>


            <div class="auth-footer">

                Korona access is controlled by your
                registered account.

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     APP
     ========================================================= -->

<div id="app">

    <div id="appShell">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">
                KORONA
            </div>

            <div class="nav">

                <button
                    data-view="home"
                    class="active"
                    type="button"
                >
                    ⌂
                    <span>Home</span>
                </button>

                <button
                    data-view="games"
                    type="button"
                >
                    🎮
                    <span>Games</span>
                </button>

                <button
                    data-view="apps"
                    type="button"
                >
                    ▦
                    <span>Apps</span>
                </button>

                <button
                    data-view="browser"
                    type="button"
                >
                    ◉
                    <span>Browser</span>
                </button>

                <button
                    data-view="settings"
                    type="button"
                >
                    ⚙
                    <span>Settings</span>
                </button>

                <button
                    data-view="account"
                    type="button"

/* =========================================================

function initializeSupabase() {

    if (supabaseClient) {
        return true;
    }

    if (
        !window.supabase ||
        typeof window.supabase.createClient !==
            "function"
    ) {

        console.error(
            "Supabase library is not loaded."
        );

        return false;
    }

    try {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        return true;

    } catch (error) {

        console.error(

            error

        return false;
    }
}

/* =========================================================
   USER STORAGE
   ========================================================= */

function getSavedUserId() {

    return localStorage.getItem(
        USER_KEY
    );

}


function clearSavedUser() {

    localStorage.removeItem(
        USER_KEY
    );

    localStorage.removeItem(
        "korona.user.id"
    );

    localStorage.removeItem(
        "korona.user.name"
    );

    currentUser =
        null;
}


/* =========================================================
   CHECK ACCESS
   ========================================================= */

async function checkSavedUser(
    options = {}
) {

    const silent =
        options.silent === true;

    const savedId =
        getSavedUserId();


    if (!savedId) {

        if (!silent) {

            showAuth();

            setAuthMessage(
                "No Korona account is registered on this browser."
            );

        }

        return false;
    }


    if (!initializeSupabase()) {

        if (!silent) {

            showAuth();

            setAuthMessage(
                "Supabase could not be loaded."
            );

        }

        return false;
    }


    try {

        const result =
            await supabaseClient

                .from(
                    "korona_users"
                )

                .select(
                    "id,name,active"
                )

                .eq(
                    "id",
                    savedId
                )

                .maybeSingle();


        if (result.error) {

            console.error(
                "Supabase access error:",
                result.error
            );

            /*
             * Don't kick someone out because of
             * a temporary network/database error.
             */

            if (!silent) {

                showAuth();

                setAuthMessage(
                    "Korona could not contact Supabase."
                );

            }

            return false;
        }


        if (!result.data) {

            clearSavedUser();

            showAuth();

            setAuthMessage(
                "This Korona account no longer exists."
            );

            return false;
        }


        /*
         * THIS IS THE APPROVAL CHECK.
         */

        if (
            result.data.active !== true
        ) {

            currentUser =
                null;

            showAuth();

            setAuthMessage(
                "Your account is waiting for approval."
            );

            return false;
        }


        /*
         * APPROVED
         */

        currentUser =
            result.data;


        localStorage.setItem(
            USER_KEY,
            result.data.id
        );

        localStorage.setItem(
            "korona.user.id",
            result.data.id
        );

        localStorage.setItem(
            "korona.user.name",
            result.data.name || ""
        );


        showApp();


        if (
            typeof renderAll ===
            "function"
        ) {

            renderAll();

        }


        return true;

    } catch (error) {

        console.error(
            "Access check failed:",
            error
        );

        if (!silent) {

            showAuth();

            setAuthMessage(
                "Korona encountered an error."
            );

        }

        return false;
    }
}


/* =========================================================
   CREATE ACCOUNT
   ========================================================= */

async function createKoronaAccount() {

    const first =
        $("firstName")
            .value
            .trim();

    const last =
        $("lastName")
            .value
            .trim();


    if (!first || !last) {

        setCreateMessage(
            "Enter your first and last name."
        );

        return;
    }


    if (!initializeSupabase()) {

        setCreateMessage(
            "Supabase has not loaded yet."
        );

        return;
    }


    const id =
        (
            first +
            "." +
            last
        )
            .toLowerCase()
            .replace(
                /[^a-z0-9.]/g,
                ""
            );


    if (!id) {

        setCreateMessage(
            "That name could not create a valid ID."
        );

        return;
    }


    setCreateMessage(
        "Submitting account..."
    );


    try {

        const existing =
            await supabaseClient

                .from(
                    "korona_users"
                )

                .select(
                    "id"
                )

                .eq(
                    "id",
                    id
                )

                .maybeSingle();


        if (existing.error) {

            console.error(
                existing.error
            );

            setCreateMessage(
                "Could not check that Korona ID."
            );

            return;
        }


        if (existing.data) {

            setCreateMessage(
                `"${id}" is already registered.`
            );

            return;
        }


        /*
         * NEW USERS ARE NOT ACTIVE.
         *
         * YOU approve them by changing active
         * to TRUE in Supabase.
         */

        const inserted =
            await supabaseClient

                .from(
                    "korona_users"
                )

                .insert({

                    id:
                        id,

                    name:
                        `${first} ${last}`,

                    active:
                        false

                });


        if (inserted.error) {

            console.error(
                inserted.error
            );

            setCreateMessage(
                inserted.error.message ||
                "Account creation failed."
            );

            return;
        }


        localStorage.setItem(
            USER_KEY,
            id
        );

        localStorage.setItem(
            "korona.user.id",
            id
        );

        localStorage.setItem(
            "korona.user.name",
            `${first} ${last}`
        );


        showLoginScreen();

        showAuth();

        setAuthMessage(
            "Account submitted. Waiting for approval."
        );


        /*
         * Check immediately.
         *
         * It should be false until you approve it.
         */

        await checkSavedUser({
            silent: true
        });


    } catch (error) {

        console.error(
            "Account creation error:",
            error
        );

        setCreateMessage(
            "Something went wrong creating the account."
        );
    }
}

function createTab(url = "") {

    const id =
        (
            crypto.randomUUID
                ? crypto.randomUUID()
                :
                "tab-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2)
        );

    const tab = {

        id:
            id,

        title:
            "New Tab",

        url:
            "",

        history:
            [],

        index:
            -1
    };

    tabs.push(tab);

    activeTabId =

    renderTabs();

    if (url) {

        navigate(url);

    } else {

        showView(
            "browser"
        );

    }
}


function activeTab() {

    return tabs.find(
        tab =>
            tab.id ===
            activeTabId
    ) || null;
}


function renderTabs() {

    const strip =
        $("tabStrip");

    if (!strip) {
        return;
    }

    strip.innerHTML =

        tabs.map(
            tab => `

                <div
                    class="
                        tab
                        ${
                            tab.id ===
                            activeTabId
                                ? "active"
                                : ""
                        }
                    "
                    data-id="${tab.id}"
                >

                    <span>
                        ${
                            escapeHTML(
                                tab.title
                            )
                        }
                    </span>

                    <span
                        class="close"
                        data-close="${tab.id}"
                    >
                        ×
                    </span>

                </div>

            `
        ).join("") +

        `

            <button
                class="tabadd"
                id="newTabButton"
                type="button"
            >
                +
            </button>

        `;


    strip
        .querySelectorAll(".tab")
        .forEach(
            element => {

                element.onclick =
                    event => {

                        if (
                            event.target
                                .dataset
                                .close
                        ) {

                            return;
                        }

                        activeTabId =
                            element.dataset.id;

                        showView(
                            "browser"
                        );

                        renderTabs();
                    };

            }
        );


    strip
        .querySelectorAll(
            "[data-close]"
        )
        .forEach(
            close => {

                close.onclick =
                    event => {

                        event.stopPropagation();

                        closeTab(
                            close.dataset.close
                        );
                    };

            }
        );


    $("newTabButton").onclick =
        () => createTab();
}


function closeTab(id) {

    const index =
        tabs.findIndex(
            tab =>
                tab.id === id
        );

    if (index < 0) {
        return;
    }

    tabs.splice(
        index,
        1
    );


    if (
        activeTabId === id
    ) {

        activeTabId =
            tabs[
                Math.max(
                    0,
                    index - 1
                )
            ]?.id || null;
    }


    if (!tabs.length) {

        createTab();

        return;
    }


    renderTabs();

    renderBrowser();
}


/* =========================================================
   URL
   ========================================================= */

function normalizeURL(value) {

    value =
        value.trim();

    if (!value) {
        return "";
    }

    if (
        /^https?:\/\//i.test(
            value
        )
    ) {

        return value;
    }

    if (
        value.includes(".") &&
        !value.includes(" ")
    ) {

        return (
            "https://" +
            value
        );
    }

    return (
        "https://www.google.com/search?q=" +
        encodeURIComponent(value)
    );
}


function navigate(raw) {

    const url =
        normalizeURL(raw);

    if (!url) {
        return;
    }

    let tab =
        activeTab();

    if (!tab) {

        createTab();

        tab =
            activeTab();
    }


    if (
        tab.index <
        tab.history.length - 1
    ) {

        tab.history =
            tab.history.slice(
                0,
                tab.index + 1
            );
    }


    tab.history.push(
        url
    );

    tab.index++;

    tab.url =
        url;


    try {

        tab.title =
            new URL(
                url
            ).hostname;

    } catch {

        tab.title =
            "Korona Browser";
    }


    $("addressInput").value =
        url;

    renderTabs();

    renderBrowser();
}


function openURL(url) {

    if (!activeTab()) {

        createTab();

    }

    navigate(url);

    showView(
        "browser"
    );
}

        element.innerHTML = `

            <div class="switch-page">

                <h1>
                    More Games
                </h1>

                <p class="muted">
                    Your complete software library.
                </p>

                <div class="cards">

                    ${
                        games
                            .map(gameCard)
                            .join("")
                    }

                </div>

            </div>

        `;

        return;
    }


    element.innerHTML = `

        <h1>
            Games
        </h1>

        <p class="muted">
            Launch games through Korona.
        </p>

        <div class="cards">

            ${
                games
                    .map(gameCard)
                    .join("")
            }

        </div>

    `;
}


/* =========================================================
   APPS
   ========================================================= */

function renderApps() {

    const element =
        $("view-apps");


    const cards =
        apps.map(
            app => `

                <article
                    class="card"
                    onclick="openURL(${JSON.stringify(app.url)})"
                >

                    <div
                        style="
                            height:150px;
                            display:grid;
                            place-items:center;
                            font-size:60px;
                            background:var(--panel2);
                            margin-bottom:12px;
                        "
                    >
                        ${
                            escapeHTML(
                                app.icon
                            )
                        }
                    </div>

                    <h3>
                        ${
                            escapeHTML(
                                app.name
                            )
                        }
                    </h3>

                    <p>
                        Open application
                    </p>

                </article>

            `
        ).join("");


    element.innerHTML = isSwitch()
        ? `

            <div class="switch-page">

                <h1>
                    Apps
                </h1>

                <p class="muted">
                    Your Korona applications.
                </p>

                <div class="cards">
                    ${cards}
                </div>

            </div>

        `
        :
        `

            <h1>
                Apps
            </h1>

            <p class="muted">
                Your Korona applications.
            </p>

            <div class="cards">
                ${cards}
            </div>

        `;
}


/* =========================================================
   SETTINGS
   ========================================================= */

function renderSettings() {

    const element =
        $("view-settings");


    const themeOptions =
        themes.map(
            theme => `

                <option
                    value="${theme.id}"
                    ${
                        theme.id ===
                        currentTheme
                            ? "selected"
                            : ""
                    }
                >
                    ${escapeHTML(theme.name)}
                </option>

            `
        ).join("");


    const characterOptions = `

        <option value="none">
            None
        </option>

        <option value="miku">
            Miku
        </option>

        <option value="teto">
            Teto
        </option>

        <option value="neru">
            Neru
        </option>

        <option value="luka">
            Luka
        </option>

        <option value="rin">
            Rin / Len
        </option>

        <option value="kaito">
            Kaito
        </option>

        <option value="meiko">
            Meiko
        </option>

    `;


    const content = `

        <h1>
            ${
                isSwitch()
                    ? "System Settings"
                    : "Settings"
            }
        </h1>

        <p class="muted">
            Customize Korona.
        </p>

        <div class="settings-grid">

            <div class="setting-card">

                <h3>
                    Theme
                </h3>

                <select
                    id="themeSelect"
                >
                    ${themeOptions}
                </select>

            </div>


            <div class="setting-card">

                <h3>
                    Character
                </h3>

                <select
                    id="characterSelect"
                >
                    ${characterOptions}
                </select>

            </div>

        </div>

    `;


    if (isSwitch()) {

        element.innerHTML = `

            <div class="switch-page">

                ${content}

            </div>

        `;

    } else {

        element.innerHTML =
            content;

    }


    const themeSelect =
        $("themeSelect");

    const characterSelect =
        $("characterSelect");


    if (themeSelect) {

        themeSelect.onchange =
            event => {

                currentTheme =
                    event.target.value;

                applyTheme();

            };

    }


    if (characterSelect) {

        characterSelect.value =
            currentCharacter;

        characterSelect.onchange =
            event => {

                currentCharacter =
                    event.target.value;

                localStorage.setItem(
                    "korona.character",
                    currentCharacter
                );

            };

    }
}


/* =========================================================
   ACCOUNT
   ========================================================= */

function renderAccount() {

    const element =
        $("view-account");


    const id =
        localStorage.getItem(
            USER_KEY
        ) ||
        "Not registered";


    const name =
        localStorage.getItem(
            "korona.user.name"
        ) ||
        "Unknown";


    const content = `

        <div class="account">

            <div class="account-row">

                <span>
                    Name
                </span>

                <strong>
                    ${escapeHTML(name)}
                </strong>

            </div>


            <div class="account-row">

                <span>
                    Korona ID
                </span>

                <strong>
                    ${escapeHTML(id)}
                </strong>

            </div>


            <div class="account-row">

                <span>
                    Access
                </span>

                <strong>
                    Approved
                </strong>

            </div>


            <button
                class="danger"
                type="button"
                onclick="koronaLogout()"
            >
                LOCK KORONA
            </button>

        </div>

    `;


    if (isSwitch()) {

        element.innerHTML = `

            <div class="switch-page">

                <h1>
                    User Page
                </h1>

                ${content}

            </div>

        `;

    } else {

        element.innerHTML = `

            <h1>
                Account
            </h1>

            ${content}

        `;
    }
}


/* =========================================================
   VIEW RENDER
   ========================================================= */

function renderView(view) {

    if (view === "home")
        renderHome();

    if (view === "games")
        renderGames();

    if (view === "apps")
        renderApps();

    if (view === "browser")
        renderBrowser();

    if (view === "settings")
        renderSettings();

    if (view === "account")
        renderAccount();
}


/* =========================================================
   RENDER ALL
   ========================================================= */

function renderAll() {

    document
        .querySelectorAll(
            ".nav button[data-view]"
        )
        .forEach(
            button => {

                const span =
                    button.querySelector(
                        "span"
                    );

                if (!span) {
                    return;
                }

                const labels = {

                    home:
                        isSwitch()
                            ? "Home"
                            : "Home",

                    games:
                        isSwitch()
                            ? "More Games"
                            : "Games",

                    apps:
                        "Apps",

                    browser:
                        isSwitch()
                            ? "Internet"
                            : "Browser",

                    settings:
                        isSwitch()
                            ? "System Settings"
                            : "Settings",

                    account:
                        isSwitch()
                            ? "User Page"
                            : "Account"

                };

                span.textContent =
                    labels[
                        button.dataset.view
                    ];

            }
        );


    renderView(
        currentView
    );

    renderTabs();
}


/* =========================================================
   EVENT LISTENERS
   ========================================================= */

function setupNavigation() {

    document
        .querySelectorAll(
            ".nav button[data-view]"
        )
        .forEach(
            button => {

                button.onclick =
                    () => {

                        showView(
                            button.dataset.view
                        );

                    };

            }
        );


    $("logoutButton").onclick =
        () => {

            koronaLogout();

        };


    $("goButton").onclick =
        () => {

            navigate(
                $("addressInput").value
            );

        };


    $("addressInput").addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                navigate(
                    event.target.value
                );

            }

        }
    );


    $("refreshButton").onclick =
        () => {

            const frame =
                $("browserFrame");

            if (frame) {

                frame.src =
                    frame.src;

            }

        };


    $("backButton").onclick =
        () => {

            const tab =
                activeTab();

            if (
                !tab ||
                tab.index <= 0
            ) {

                return;

            }

            tab.index--;

            tab.url =
                tab.history[
                    tab.index
                ];

            renderBrowser();

            renderTabs();

        };


    $("forwardButton").onclick =
        () => {

            const tab =
                activeTab();

            if (
                !tab ||
                tab.index >=
                    tab.history.length - 1
            ) {

                return;

            }

            tab.index++;

            tab.url =
                tab.history[
                    tab.index
                ];

            renderBrowser();

            renderTabs();

        };


    $("fullscreenButton").onclick =
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();

                }

            } catch (error) {

                console.error(
                    "Fullscreen error:",
                    error
                );

            }

        };
}


/* =========================================================
   AUTH BUTTONS
   ========================================================= */

function setupAuthButtons() {

    console.log(
        "Korona: binding authentication buttons..."
    );


    $("showCreateButton").onclick =
        () => {

            showCreateScreen();

            setCreateMessage("");

        };


    $("backLoginButton").onclick =
        () => {

            showLoginScreen();

            setAuthMessage("");

        };


    $("loginButton").onclick =
        async () => {

            const button =
                $("loginButton");

            button.disabled =
                true;

            button.textContent =
                "CHECKING...";

            await checkSavedUser();

            button.disabled =
                false;

            button.textContent =
                "CHECK KORONA ACCESS";

        };


    $("createButton").onclick =
        async () => {

            const button =
                $("createButton");

            button.disabled =
                true;

            button.textContent =
                "SUBMITTING...";

            await createKoronaAccount();

            button.disabled =
                false;

            button.textContent =
                "SUBMIT ACCOUNT";

        };


    /*
     * Allows Enter to submit the create form.
     */

    $("firstName").addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                $("lastName").focus();

            }

        }
    );


    $("lastName").addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                createKoronaAccount();

            }

        }
    );


    console.log(
        "Korona: authentication buttons ready."
    );
}


/* =========================================================
   FIVE SECOND ACCESS WATCHER
   ========================================================= */

setInterval(
    async () => {

        const savedId =
            getSavedUserId();

        if (!savedId) {
            return;
        }

        if (
            accessCheckRunning
        ) {
            return;
        }

        accessCheckRunning =
            true;

        try {

            await checkSavedUser({
                silent: true
            });

        } finally {

            accessCheckRunning =
                false;

        }

    },
    5000
);


/* =========================================================
   STARTUP
   ========================================================= */

async function startKorona() {

    console.log(
        "Korona starting..."
    );


    /*
     * AUTH BUTTONS ARE SET UP FIRST.
     *
     * This means a Supabase problem cannot
     * prevent the buttons from receiving clicks.
     */

    setupAuthButtons();


    /*
     * Setup normal application controls.
     */

    setupNavigation();


    /*
     * Start browser.
     */

    createTab();


    /*
     * Apply saved theme.
     */

    document.body.classList.toggle(
        "switch-theme",
        currentTheme ===
            "switch"
    );


    /*
     * Show authentication while checking.
     */

    showAuth();


    /*
     * Check saved account.
     */

    await checkSavedUser();

}


/* =========================================================
   START
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        startKorona
    );

} else {

    startKorona();

}


/* =========================================================
   SWITCH CLOCK
   ========================================================= */

setInterval(
    () => {

        const clock =
            $("switchClock");

        if (!clock) {
            return;
        }

        clock.textContent =
            new Date().toLocaleTimeString(
                [],
                {
                    hour:
                        "numeric",

                    minute:
                        "2-digit"
                }
            );

    },
    1000
);

</script>
